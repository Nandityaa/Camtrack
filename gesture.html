<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hand Gesture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            /* FLIP - not mirrored like front camera */
        }

        #canvasElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Canvas NOT flipped - only video is flipped */
        }

        /* DOT MATRIX PIXEL TEXT STYLE like image 3 */
        #overlayText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            font-family: 'Courier New', 'Arial Black', monospace;
            letter-spacing: 20px;
            opacity: 0;
            transition: opacity 0.3s, color 0.3s;
            pointer-events: none;
            z-index: 10;
            text-transform: uppercase;

            /* DOT MATRIX EFFECT - Multiple small shadows to create dots */
            text-shadow:
                /* Dot pattern */
                -2px -2px 0 rgba(255, 255, 255, 0.3),
                2px -2px 0 rgba(255, 255, 255, 0.3),
                -2px 2px 0 rgba(255, 255, 255, 0.3),
                2px 2px 0 rgba(255, 255, 255, 0.3),
                -4px -4px 0 rgba(255, 255, 255, 0.2),
                4px -4px 0 rgba(255, 255, 255, 0.2),
                -4px 4px 0 rgba(255, 255, 255, 0.2),
                4px 4px 0 rgba(255, 255, 255, 0.2),
                /* Glow */
                0 0 30px currentColor,
                0 0 60px currentColor;

            /* Pixelated filter */
            filter: contrast(1.3) brightness(1.2);
        }

        #overlayText.visible {
            opacity: 0.9;
        }

        /* Blue for HELLO */
        #overlayText.blue {
            color: #00a8ff;
        }

        /* White for NANDITYA */
        #overlayText.white {
            color: #ffffff;
        }

        /* WAVE/DISTORTION effect when touched - like image 2 */
        #overlayText.touched {
            animation: waveDistortion 0.3s ease-in-out infinite;
            text-shadow:
                -3px -3px 0 rgba(255, 255, 255, 0.4),
                3px -3px 0 rgba(255, 255, 255, 0.4),
                -3px 3px 0 rgba(255, 255, 255, 0.4),
                3px 3px 0 rgba(255, 255, 255, 0.4),
                -6px 0 0 rgba(255, 255, 255, 0.3),
                6px 0 0 rgba(255, 255, 255, 0.3),
                0 0 40px currentColor,
                0 0 80px currentColor,
                0 0 120px currentColor;
            filter: contrast(1.5) brightness(1.3) blur(0.5px);
        }

        @keyframes waveDistortion {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1, 1);
            }

            25% {
                transform: translate(-50%, -50%) scale(1.02, 0.98) skewX(2deg);
            }

            50% {
                transform: translate(-50%, -50%) scale(0.98, 1.02) skewX(-2deg);
            }

            75% {
                transform: translate(-50%, -50%) scale(1.01, 0.99) skewX(1deg);
            }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00a8ff;
            font-size: 16px;
            text-align: center;
            z-index: 100;
        }

        #loading.hidden {
            display: none;
        }

        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }

        .spinner {
            border: 3px solid rgba(0, 168, 255, 0.1);
            border-top: 3px solid #00a8ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>
    <div id="overlayText">HELLO</div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading Hand Tracking AI...</div>
        <div style="font-size: 12px; margin-top: 10px; color: #666;">This may take 10-30 seconds</div>
    </div>

    <div id="instructions">
        <div>✋ Show 1 finger → HELLO (blue) | Show 2 fingers → NANDITYA (white)</div>
        <div style="font-size: 12px; margin-top: 5px;">Use second hand to touch and move the text</div>
    </div>

    <!-- MediaPipe - Using UNPKG (faster CDN) -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="gesture-app.js"></script>
</body>

</html>
